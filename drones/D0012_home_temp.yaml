drone_id: D0012
drone_name: starling2-max
platform: ModalAI Starling 2 Max
flight_computer: PX4 on VOXL2
companion_computer: VOXL2
ip_address: 10.249.98.97
ros_domain_id: 3
ssh_user: root

paths:
  drone_sync_folder: /home/root/halo_sync_test
  px4_log_folder: /data/px4/log
  local_archive_root: /home/zafar/MIC_ARRAY_ROS/HALO_ARCHIVE

sensors:
  respeaker:
    enabled: true
    alsa_device: hw:0,0
    sample_rate_hz: 16000
    channels: 6
    sample_format: S16_LE

px4:
  microdds_service: voxl-microdds-agent
  timesync_topic: /fmu/out/timesync_status
  required_ulog_topics:
    - esc_status
    - sensor_combined
    - vehicle_acceleration
    - vehicle_angular_velocity
    - vehicle_local_position
    - actuator_outputs
    - actuator_motors
    - vehicle_status
