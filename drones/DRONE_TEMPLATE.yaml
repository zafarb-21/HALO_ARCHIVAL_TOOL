# Copy this file for a future sixth lab drone, then replace every placeholder.
# Do not add it to swarm_lab.yaml until its real drone ID, IP, and SSH alias exist.
drone_id: REPLACE_WITH_DRONE_ID
drone_name: REPLACE_WITH_DRONE_NAME
platform: ModalAI Starling 2 Max
flight_computer: PX4 on VOXL2
companion_computer: VOXL2
ip_address: REPLACE_WITH_ASSIGNED_LAB_IP
ros_domain_id: null  # REQUIRED: fill the actual ROS_DOMAIN_ID
enabled: true
required: true
post_landing_record_s: 3
ssh_user: root

paths:
  drone_sync_folder: /home/root/halo_sync_test
  px4_log_folder: /data/px4/log
  local_archive_root: /home/zafar/MIC_ARRAY_ROS/HALO_ARCHIVE

audio:
  enabled: true
  audio_device: hw:0,0
  sample_rate_hz: 16000
  channels: 6
  sample_format: S16_LE
  mic_array_type: ReSpeaker_or_future_custom_array

sensors:
  respeaker:
    enabled: true
    alsa_device: hw:0,0
    sample_rate_hz: 16000
    channels: 6
    sample_format: S16_LE

ros2_bag:
  enabled: false
  foxy_setup: /opt/ros/foxy/setup.bash
  output_subfolder: bags
  fallback_record_all_if_topics_unavailable: false

px4:
  log_path: /data/px4/log
  microdds_service: voxl-microdds-agent
  timesync_topic: /fmu/out/timesync_status
