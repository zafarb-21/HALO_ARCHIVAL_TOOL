# HALO lab swarm inventory. Every ssh_host must exist in ~/.ssh/config.
# See docs/MULTI_DRONE_SSH_SETUP.md. Add a future sixth drone only after its
# assigned IP address and SSH alias are known.
drones:
  - drone_id: D0012
    config: drones/D0012.yaml
    ssh_host: halo-d0012
    ip_address: 192.168.0.20
    ros_domain_id: 3
    enabled: true
    required: true
    post_landing_record_s: 3
